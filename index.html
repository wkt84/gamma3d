<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Gamma3D</title>
  </head>
  <body>
    <!-- 文言は src/i18n の辞書から data-i18n* 属性のキーで流し込む -->
    <header class="app-header">
      <h1>Gamma3D <span class="subtitle" data-i18n="app.subtitle"></span></h1>
      <div class="header-end">
        <span class="meta" id="app-meta"></span>
        <select id="lang" data-i18n-aria-label="app.language"></select>
        <a class="github" href="https://github.com/wkt84/gamma3d" target="_blank" rel="noopener noreferrer" data-i18n-title="app.github" data-i18n-aria-label="app.github">
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </header>

    <div class="layout">
      <aside class="input-pane" data-i18n-aria-label="app.inputPane">
        <section class="card" data-side="ref">
          <h2><span data-i18n="side.ref"></span> <span class="tag">Reference</span></h2>
          <div class="dropzone" tabindex="0" role="button">
            <p data-i18n="side.drop"></p>
            <p class="hint"><span data-i18n="side.dropHint"></span> <a href="#" class="pick-dir" data-i18n="side.pickDir"></a></p>
            <input type="file" class="file-input" multiple hidden />
            <input type="file" class="dir-input" webkitdirectory multiple hidden />
          </div>
          <div class="dose-info" hidden>
            <label><span data-i18n="side.dose"></span> <select class="set-select"></select></label>
            <p class="set-summary"></p>
            <details class="file-list"><summary></summary><ul></ul></details>
            <p class="plan-info" hidden></p>
            <div class="scale-row">
              <label class="inline"><span data-i18n="side.scale"></span>
                <input type="number" class="scale-num" value="1" step="any" min="0" data-i18n-aria-label="side.scaleNum" />
                <span aria-hidden="true">/</span>
                <input type="number" class="scale-den" value="1" step="any" min="0" data-i18n-aria-label="side.scaleDen" />
              </label>
              <span class="scale-value hint"></span>
            </div>
            <button class="per-fraction" hidden></button>
            <p class="hint" data-i18n="side.scaleHint"></p>
            <ul class="warnings"></ul>
          </div>
        </section>

        <button id="swap" class="swap" disabled data-i18n-title="side.swapTitle"><span aria-hidden="true">⇅</span> <span data-i18n="side.swap"></span></button>

        <section class="card" data-side="eval">
          <h2><span data-i18n="side.eval"></span> <span class="tag">Evaluated</span></h2>
          <div class="dropzone" tabindex="0" role="button">
            <p data-i18n="side.drop"></p>
            <p class="hint"><span data-i18n="side.dropHint"></span> <a href="#" class="pick-dir" data-i18n="side.pickDir"></a></p>
            <input type="file" class="file-input" multiple hidden />
            <input type="file" class="dir-input" webkitdirectory multiple hidden />
          </div>
          <div class="dose-info" hidden>
            <label><span data-i18n="side.dose"></span> <select class="set-select"></select></label>
            <p class="set-summary"></p>
            <details class="file-list"><summary></summary><ul></ul></details>
            <p class="plan-info" hidden></p>
            <div class="scale-row">
              <label class="inline"><span data-i18n="side.scale"></span>
                <input type="number" class="scale-num" value="1" step="any" min="0" data-i18n-aria-label="side.scaleNum" />
                <span aria-hidden="true">/</span>
                <input type="number" class="scale-den" value="1" step="any" min="0" data-i18n-aria-label="side.scaleDen" />
              </label>
              <span class="scale-value hint"></span>
            </div>
            <button class="per-fraction" hidden></button>
            <p class="hint" data-i18n="side.scaleHint"></p>
            <div class="shift-head">
              <span data-i18n="side.shift"></span>
              <button class="shift-reset" data-i18n="side.shiftReset"></button>
            </div>
            <div class="shift-row">
              <label class="inline">x <input type="number" class="shift" data-axis="0" value="0" step="0.5" data-i18n-aria-label="side.shiftX" /></label>
              <label class="inline">y <input type="number" class="shift" data-axis="1" value="0" step="0.5" data-i18n-aria-label="side.shiftY" /></label>
              <label class="inline">z <input type="number" class="shift" data-axis="2" value="0" step="0.5" data-i18n-aria-label="side.shiftZ" /></label>
            </div>
            <p class="hint" data-i18n="side.shiftHint"></p>
            <ul class="warnings"></ul>
          </div>
        </section>

        <section class="card params">
          <h2 data-i18n="params.title"></h2>
          <label><span data-i18n="params.preset"></span>
            <select id="preset">
              <optgroup data-i18n-label="presets.standardGroup">
                <option value="3,3">3% / 3 mm</option>
                <option value="3,2">3% / 2 mm</option>
                <option value="2,2">2% / 2 mm</option>
                <option value="1,1">1% / 1 mm</option>
              </optgroup>
              <option value="custom" data-i18n="params.custom"></option>
            </select>
          </label>
          <details class="presets">
            <summary data-i18n="presets.title"></summary>
            <div class="preset-row">
              <input type="text" id="preset-name" maxlength="60" data-i18n-placeholder="presets.namePlaceholder" data-i18n-aria-label="presets.name" />
              <button id="preset-save" data-i18n="presets.save"></button>
            </div>
            <div class="preset-row">
              <button id="preset-delete" data-i18n="presets.delete" disabled></button>
              <button id="preset-export" data-i18n="presets.export"></button>
              <button id="preset-import" data-i18n="presets.import"></button>
              <input type="file" id="preset-file" accept=".json,application/json" hidden />
            </div>
            <p id="preset-status" class="hint" aria-live="polite"></p>
          </details>
          <div class="row2">
            <label>DD (%) <input type="number" id="p-dd" value="3" step="0.5" min="0.1" /></label>
            <label>DTA (mm) <input type="number" id="p-dta" value="3" step="0.5" min="0.1" /></label>
          </div>
          <fieldset class="segmented">
            <legend data-i18n="params.norm"></legend>
            <label><input type="radio" name="norm" value="global" checked /> Global</label>
            <label><input type="radio" name="norm" value="local" /> Local</label>
          </fieldset>
          <label><span data-i18n="params.normDose"></span>
            <span class="with-check">
              <input type="number" id="p-normdose" step="0.01" min="0" disabled />
              <label class="inline"><input type="checkbox" id="p-normauto" checked /> <span data-i18n="params.normAuto"></span></label>
            </span>
          </label>
          <div class="row2">
            <label><span data-i18n="params.gammaThreshold"></span> <input type="number" id="p-gthr" value="10" step="1" min="0" max="100" /></label>
            <label><span data-i18n="params.ddThreshold"></span> <input type="number" id="p-ddthr" value="10" step="1" min="0" max="100" /></label>
          </div>
          <div class="row2">
            <label data-i18n-title="params.gradientTitle"><span data-i18n="params.gradient"></span> <input type="number" id="p-grad" value="3" step="0.5" min="0" /></label>
            <label class="inline check-cell"><input type="checkbox" id="p-ddlow" /> <span data-i18n="params.ddLowGradient"></span></label>
          </div>
          <div class="row2" data-i18n-title="params.levelsTitle">
            <label><span data-i18n="params.tolerance"></span> <input type="number" id="p-tol" class="level" value="95" step="1" min="0" max="100" /></label>
            <label><span data-i18n="params.action"></span> <input type="number" id="p-act" class="level" value="90" step="1" min="0" max="100" /></label>
          </div>
          <label class="inline" data-i18n-title="params.batchTitle"><input type="checkbox" id="p-batch" class="level" /> <span data-i18n="params.batch"></span></label>
          <details class="advanced">
            <summary data-i18n="params.advanced"></summary>
            <div class="row2">
              <label data-i18n-title="params.capTitle"><span data-i18n="params.cap"></span> <input type="number" id="p-cap" value="2" step="0.5" min="1" max="3" /></label>
              <label data-i18n-title="params.stepsTitle"><span data-i18n="params.steps"></span> <input type="number" id="p-steps" value="10" step="1" min="2" max="20" /></label>
            </div>
            <p class="hint" data-i18n="params.advancedHint"></p>
          </details>
          <div class="run-row">
            <button id="run" class="primary" disabled data-i18n="params.run"></button>
            <button id="cancel" hidden data-i18n="params.cancel"></button>
          </div>
          <progress id="progress" max="1" value="0" hidden></progress>
          <p id="run-status" class="hint" aria-live="polite"></p>
        </section>

        <section class="card report">
          <h2 data-i18n="report.title"></h2>
          <label class="inline"><input type="checkbox" id="r-patient" checked /> <span data-i18n="report.includePatient"></span></label>
          <label><span data-i18n="report.reviewer"></span> <input type="text" id="r-reviewer" data-i18n-placeholder="report.reviewerPlaceholder" /></label>
          <label><span data-i18n="report.comment"></span> <textarea id="r-comment" rows="2"></textarea></label>
          <button id="pdf" disabled data-i18n="report.button"></button>
          <p id="pdf-status" class="hint" aria-live="polite"></p>
        </section>

        <section class="card export">
          <h2 data-i18n="export.title"></h2>
          <label class="inline"><input type="checkbox" id="x-patient" /> <span data-i18n="export.includePatient"></span></label>
          <div class="export-buttons">
            <button id="export-csv" disabled data-i18n="export.csv" data-i18n-title="export.csvTitle"></button>
            <button id="export-json" disabled data-i18n="export.json" data-i18n-title="export.jsonTitle"></button>
            <button id="export-maps" disabled data-i18n="export.maps" data-i18n-title="export.mapsTitle"></button>
          </div>
          <p id="export-status" class="hint" aria-live="polite"></p>
        </section>
      </aside>

      <main class="result-pane" data-i18n-aria-label="app.resultPane">
        <div class="summary" id="summary"></div>

        <div class="toolbar">
          <div class="segmented plane" role="radiogroup" data-i18n-aria-label="viewer.plane">
            <button data-plane="axial" class="active">Axial</button>
            <button data-plane="sagittal">Sagittal</button>
            <button data-plane="coronal">Coronal</button>
          </div>
          <label class="slice-ctrl"><span data-i18n="viewer.slice"></span>
            <input type="range" id="slice" min="0" max="0" value="0" />
            <span id="slice-label">–</span>
          </label>
          <div class="segmented bottom-view" role="group" data-i18n-aria-label="viewer.bottomView">
            <button data-bottom="hist" class="active" aria-pressed="true" data-i18n="viewer.histograms"></button>
            <button data-bottom="profile" aria-pressed="false" data-i18n="viewer.profiles"></button>
          </div>
          <details class="window-menu">
            <summary data-i18n="viewer.window" data-i18n-title="viewer.windowTitle"></summary>
            <div class="menu">
              <label><span data-i18n="viewer.windowMin"></span> <input type="number" id="win-min" value="0" step="any" /></label>
              <label><span data-i18n="viewer.windowMax"></span> <input type="number" id="win-max" step="any" data-i18n-placeholder="viewer.windowAuto" /></label>
              <label><span data-i18n="viewer.lowCut"></span> <input type="number" id="win-cut" value="0" min="0" max="100" step="any" /></label>
              <button id="view-reset" data-i18n="viewer.resetView" data-i18n-title="viewer.resetViewTitle"></button>
            </div>
          </details>
          <button id="zoom-reset" class="zoom-chip" hidden data-i18n-title="viewer.zoomTitle"></button>
          <span class="hint-icon" tabindex="0" role="img" data-i18n-title="viewer.hint" data-i18n-aria-label="viewer.hint">?</span>
          <span class="readout" id="readout"></span>
        </div>

        <div class="grid">
          <figure class="panel" id="panel-ref"></figure>
          <figure class="panel" id="panel-eval"></figure>
          <figure class="panel" id="panel-map"></figure>
          <figure class="chart hist" id="chart-dd"></figure>
          <figure class="chart hist" id="chart-dta"></figure>
          <figure class="chart hist" id="chart-gamma"></figure>
          <figure class="chart profile" id="profile-x"></figure>
          <figure class="chart profile" id="profile-y"></figure>
          <figure class="chart profile" id="profile-z"></figure>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
